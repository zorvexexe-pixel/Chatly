<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chatly</title>
<style>
:root{--bg:#efeae2;--panel:#fff;--head:#128c7e;--headt:#fff;--mine:#d9fdd3;--theirs:#fff;--text:#111b21;--sub:#667781;--line:#e9edef;--accent:#25d366;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b141a;--panel:#111b21;--head:#1f2c34;--mine:#005c4b;--theirs:#202c33;--text:#e9edef;--sub:#8696a0;--line:#222d34;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b141a;--panel:#111b21;--head:#1f2c34;--mine:#005c4b;--theirs:#202c33;--text:#e9edef;--sub:#8696a0;--line:#222d34;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--panel);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
#app{height:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;background:var(--panel)}
header{background:var(--head);color:var(--headt);padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px}
header button{background:none;border:0;color:inherit;font-size:22px;cursor:pointer;padding:0 6px}
header small{display:block;font-weight:400;font-size:12px;opacity:.8}
#list{flex:1;overflow:auto}
.room{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.av{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.room b{display:block}.room span{color:var(--sub);font-size:13px}
#fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--accent);color:#fff;border:0;border-radius:16px;width:56px;height:56px;font-size:28px;box-shadow:0 2px 8px #0004;cursor:pointer}
#chat{display:none;flex:1;flex-direction:column;min-height:0}
#msgs{flex:1;overflow:auto;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:4px}
.m{max-width:80%;padding:6px 10px;border-radius:10px;background:var(--theirs);align-self:flex-start;word-wrap:break-word;white-space:pre-wrap}
.m.me{background:var(--mine);align-self:flex-end}
.m .n{font-size:12px;font-weight:600;color:var(--head)}
.m .t{font-size:11px;color:var(--sub);text-align:right;margin-top:2px}
form{display:flex;gap:8px;padding:8px;background:var(--panel);border-top:1px solid var(--line)}
#in{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:22px;padding:10px 14px;font:inherit;outline:0}
#send{background:var(--accent);color:#fff;border:0;border-radius:50%;width:44px;height:44px;font-size:18px;cursor:pointer}
#note{font-size:12px;color:var(--sub);padding:6px 14px;background:var(--panel)}
#att{background:none;border:0;font-size:22px;cursor:pointer}
.m img{max-width:100%;max-height:260px;border-radius:8px;display:block;margin-bottom:4px}
.m a{color:#027eb5;word-break:break-all}
#calls{display:flex}
#call{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#call[hidden]{display:none}
#rv{width:100%;flex:1;min-height:0;object-fit:cover;background:#111}
#lv{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));width:90px;border-radius:10px;background:#222}
#cs{padding:12px;font-size:16px}
#cb{display:flex;gap:16px;padding:0 0 22px}
#cb button{border:0;border-radius:24px;padding:12px 24px;font-size:16px;color:#fff;background:#e53935;cursor:pointer}
#acc{background:#25d366!important}
#mic{background:none;border:0;cursor:pointer;padding:0 4px}#mic svg{width:24px;height:24px;fill:var(--sub)}#mic.rec svg{fill:#e53935}
#rbar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--panel);border-top:1px solid var(--line);font-size:13px;color:var(--sub)}#rbar[hidden]{display:none}
#rtxt{flex:1;border-left:3px solid var(--accent);padding-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rx{background:none;border:0;color:var(--sub);font-size:20px;cursor:pointer}
.q{border-left:3px solid var(--accent);background:#0001;border-radius:6px;padding:3px 8px;font-size:13px;color:var(--sub);margin-bottom:4px}
.m .t svg{width:16px;height:11px;fill:none;stroke:var(--sub);stroke-width:1.8;vertical-align:middle;margin-left:3px}.m .t svg.rd{stroke:#34b7f1}
.m audio{max-width:100%;height:36px}.m .del{font-style:italic;color:var(--sub)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}#sheet[hidden]{display:none}
#sheet button{background:none;border:0;color:var(--text);font:inherit;padding:14px;text-align:left;cursor:pointer}
header svg{width:24px;height:24px;fill:currentColor;display:block}
#logo svg{width:34px;height:34px}
#logo{display:inline-flex;vertical-align:middle;margin-right:8px}
#out{margin-left:0}
.av{overflow:hidden;flex:none}img.av{display:block}.empty{padding:24px;text-align:center;color:var(--sub)}
#sbar{padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}#sbar[hidden]{display:none}
#sq{width:100%;border:0;background:var(--bg);color:var(--text);border-radius:20px;padding:10px 14px;font:inherit;outline:0}
#prof{position:fixed;inset:0;z-index:55;background:var(--panel);overflow:auto;padding-top:env(safe-area-inset-top,0px)}#prof[hidden]{display:none}
#pfb{max-width:640px;margin:0 auto;padding:0 16px 24px;display:flex;flex-direction:column;align-items:center;gap:10px}
#pfh{width:100%;display:flex;align-items:center;gap:10px;padding:12px 0;font-size:18px}#pfh button{background:none;border:0;color:var(--text);cursor:pointer;padding:0}#pfh svg{width:24px;height:24px;fill:currentColor;display:block}
#pfn{font-size:20px;font-weight:600}#pfu{color:var(--sub)}
#pfch,#pfsh{background:var(--accent);color:#fff;border:0;border-radius:20px;padding:10px 20px;font:inherit;cursor:pointer}
#pfs{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:10px;font:inherit}
#pfbl{width:100%}.brow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.brow button{background:none;border:1px solid var(--line);color:var(--text);border-radius:14px;padding:4px 12px;cursor:pointer}#pferr{color:var(--sub);font-size:14px}
#pf,#out,#pfx,#pfh{display:none!important}
#list{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
#fab{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:56;display:flex;justify-content:center;gap:6px;background:var(--panel);border-top:1px solid var(--line);padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px))}
#nav[hidden]{display:none}
#nav button{flex:1;max-width:200px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--sub);font:inherit;font-size:12px;padding:6px 0;border-radius:14px;cursor:pointer}
#nav svg{width:24px;height:24px;fill:currentColor}
#nav button.on{color:var(--accent);background:#25d3661f}
#prof{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
#pfb{padding:0 0 24px;gap:0}
#pfban{width:100%;height:150px;background:linear-gradient(135deg,#128c7e,#25d366 45%,#7c4dff);position:relative;overflow:hidden;border-radius:0 0 28px 28px}
#pfban::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,#ffffff40,transparent 40%),radial-gradient(circle at 85% 80%,#ffffff2a,transparent 45%)}
#pfavw{position:relative;margin-top:-52px}
#pfav .av{border:4px solid var(--panel);box-shadow:0 6px 20px #0004,0 0 0 3px #25d366}
#pfch{position:absolute;right:-2px;bottom:2px;width:34px;height:34px;border-radius:50%;padding:0;display:grid;place-items:center;border:3px solid var(--panel);box-shadow:0 2px 8px #0003}
#pfch svg{width:16px;height:16px;fill:#fff}
#pfn{font-size:24px;font-weight:700;margin-top:10px}
#pfu{margin-top:4px;padding:4px 14px;border-radius:20px;background:#25d36622;color:var(--accent);font-weight:600;font-size:14px}
#pfst{display:flex;gap:10px;width:calc(100% - 32px);margin-top:18px}
#pfst div{flex:1;background:var(--bg);border-radius:16px;padding:12px 6px;text-align:center;display:flex;flex-direction:column}
#pfst b{font-size:20px}#pfst span{font-size:12px;color:var(--sub)}
#pfact{display:flex;gap:10px;width:calc(100% - 32px);margin-top:16px}
#pfsh{flex:1;background:linear-gradient(135deg,#128c7e,#25d366)!important;border-radius:16px!important;padding:13px!important;font-weight:600;box-shadow:0 4px 14px #25d36655}
#pfcp{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:13px 20px;font:inherit;cursor:pointer}
#pfs{width:calc(100% - 32px);margin-top:12px;font-size:13px;border-radius:14px}
#pferr{margin-top:8px}
#pfbl{width:calc(100% - 32px);margin-top:10px;background:var(--bg);border-radius:16px;padding:0 14px}#pfbl:empty{display:none}#pfbl>b{display:block;padding:12px 0 4px}
#pfout{margin-top:18px;width:calc(100% - 32px);background:none;border:1px solid #e53935;color:#e53935;border-radius:16px;padding:12px;font:inherit;font-weight:600;cursor:pointer}
#att svg{width:24px;height:24px;fill:var(--sub)}
#send svg,#fab svg{width:22px;height:22px;fill:#fff;display:block;margin:auto}
#send{display:grid;place-items:center;padding:0}
#fab{display:grid;place-items:center;padding:0}
#login{position:fixed;inset:0;z-index:60;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px}
#login[hidden]{display:none}
#biglogo svg{width:84px;height:84px}
#login h2{margin:0 0 8px}
#lf{flex-direction:column;border:0;width:100%;max-width:320px;background:none}
#lf input{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:12px 14px;font:inherit;outline:0}
#lb{background:var(--accent);color:#fff;border:0;border-radius:22px;padding:12px;font:inherit;font-weight:600;cursor:pointer}
#nc{position:fixed;inset:0;z-index:45;background:#0008;display:flex;align-items:flex-end;justify-content:center}#nc[hidden]{display:none}
#ncb{background:var(--panel);width:100%;max-width:640px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;border-radius:16px 16px 0 0}
#ncb input{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:12px;font:inherit;outline:0}
#nerr,#lerr{color:#e53935;font-size:14px;max-width:320px;text-align:center}#nerr{max-width:none;text-align:left}
.nrow{display:flex;gap:10px;justify-content:flex-end}.nrow button{border:0;border-radius:20px;padding:10px 18px;font:inherit;cursor:pointer;background:var(--line);color:var(--text)}#ng{background:var(--accent)!important;color:#fff!important}
#cl,#su{background:none;color:var(--text);border:1px solid var(--line);border-radius:22px;padding:12px;font:inherit;cursor:pointer}

/* refresh */
:root{--accent:#00c896;--head:#0f766e}
header{background:linear-gradient(135deg,#0f766e,#14b8a6);box-shadow:0 2px 10px #0003;position:relative;z-index:2}
.av{background:linear-gradient(135deg,#14b8a6,#6366f1);box-shadow:0 2px 6px #0003}
.room{transition:background .15s}.room:active{background:var(--line)}
#fab{background:linear-gradient(135deg,#14b8a6,#6366f1);border-radius:50%;transition:transform .15s}#fab:active{transform:scale(.9)}
#msgs{background:var(--bg) radial-gradient(circle at 20% 10%,#14b8a61f,transparent 40%),radial-gradient(circle at 85% 85%,#6366f11f,transparent 45%)}
.m{position:relative;border-radius:16px 16px 16px 4px;box-shadow:0 1px 2px #0002;will-change:transform}.m.new{animation:pop .22s cubic-bezier(.2,.8,.2,1)}
.m.me{border-radius:16px 16px 4px 16px;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff}
.m.me .t,.m.me .n{color:#ffffffcc}.m.me a{color:#fff}
.mm{cursor:pointer;font-weight:700;font-size:20px;padding:6px 14px;opacity:.95}
@keyframes pop{from{transform:scale(.92) translateY(6px);opacity:0}to{transform:none;opacity:1}}
#send{background:linear-gradient(135deg,#14b8a6,#6366f1);transition:transform .15s}#send:active{transform:scale(.88)}
#in{border-radius:24px;box-shadow:0 1px 3px #0001}
.m audio{max-width:220px;height:36px;display:block}
.pw{position:relative;width:100%;max-width:320px}.pw input{width:100%;padding-right:46px}.eye{color:var(--sub);position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:20px;cursor:pointer;padding:4px;line-height:1}

/* smoothness */
*{-webkit-tap-highlight-color:transparent}
button,.room,.m,input{touch-action:manipulation}
#msgs,#list,#prof{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#list{scroll-behavior:smooth}
button{transition:transform .12s ease,opacity .15s ease,background-color .15s ease}
button:active{transform:scale(.94)}
#in,#login input{transition:box-shadow .2s ease,border-color .2s ease}
#in:focus,#login input:focus{box-shadow:0 0 0 3px #14b8a655;border-color:#14b8a6}
#chat{animation:slidein .24s cubic-bezier(.2,.8,.2,1)}
#prof:not([hidden]){animation:slidein .24s cubic-bezier(.2,.8,.2,1)}
#sheet:not([hidden]){animation:slideup .2s cubic-bezier(.2,.8,.2,1)}
#login:not([hidden]),#call:not([hidden]){animation:fadein .25s ease}
.room{animation:fadein .3s ease both}
@keyframes slidein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
#lv{transform:scaleX(-1)}

#pfstars{width:100%;max-width:320px;margin-top:4px}
#pfstarsbtn{width:100%;text-align:left;background:var(--box);border:1px solid var(--line);border-radius:10px;padding:12px}
#starview,#fwpick{position:fixed;inset:0;z-index:60;background:#0008;display:flex;align-items:flex-end}
#starview[hidden],#fwpick[hidden]{display:none}
#svh{display:flex;align-items:center;gap:10px;padding:12px;background:var(--panel)}
#svh button{background:none;border:0;color:var(--text)}
#svlist{background:var(--panel);width:100%;max-height:70vh;overflow:auto;padding:4px 0}
.svrow{padding:12px 16px;border-bottom:1px solid var(--line)}
.svrow b{display:block;font-size:13px;color:var(--bar)}
.empty{padding:20px;color:var(--sub);text-align:center}
#fwb{background:var(--panel);width:100%;border-radius:16px 16px 0 0;padding:14px;max-height:70vh;overflow:auto}
.fwr{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);padding:12px 4px;border-bottom:1px solid var(--line)}
#fwx{margin-top:8px;width:100%;background:var(--box);border:1px solid var(--line);border-radius:10px;padding:10px}
.fwdtag{font-size:11px;opacity:.6;font-style:italic;margin-bottom:2px}
</style><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#128c7e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script>
</head>

<div id="note" hidden></div>
<div id="sbar" hidden><input id="sq" placeholder="Search username to start a chat" autocomplete="off"></div><div id="list"></div><button id="fab" aria-label="New chat"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg></button>
<div id="chat"><div id="msgs"></div>

</div>

let notifyReady=false;
function initNotify(){
  if(notifyReady||!("Notification" in window))return;notifyReady=true;
  if(Notification.permission==="default")Notification.requestPermission().catch(()=>{});
  SB.raw.channel("chatly-notify").on("postgres_changes",{event:"INSERT",schema:"public",table:"docs",filter:"collection=eq.messages"},p=>{
    const m=p.new&&p.new.data;if(!m)return;
    if(su(m)===uname()||m.del)return;
    if(document.visibilityState==="visible"&&room===m.room)return;
    notifyShow(m)
  }).subscribe()
}
async function notifyShow(m){
  if(Notification.permission!=="granted")return;
  const title=(m.name||"Someone")+" • Chatly",body=m.fwd?"Forwarded: ":""+(m.text?m.text.slice(0,90):(m.img?"Photo":m.aud?"Voice message":"New message"));
  try{if(navigator.serviceWorker){const reg=await navigator.serviceWorker.getRegistration();if(reg){reg.showNotification(title,{body,icon:"icon-192.png",tag:"chatly-"+m.room});return}}
    new Notification(title,{body,icon:"icon-192.png"})}catch(e){}
}
